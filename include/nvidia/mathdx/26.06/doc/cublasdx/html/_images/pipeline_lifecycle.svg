<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">cuBLASDx pipeline lifecycle</title>
  <desc id="desc">Host code creates a pipeline from global tensors, passes a device handle to the kernel, each block gets a tile pipeline, then tile pipeline execution owns a grouped region that overlaps multiple asynchronous load stages with multiple asynchronous compute stages before one epilogue stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/></marker>
    <style><![CDATA[
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.5; }
      .host { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.5; }
      .dev { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.4; }
      .ghostDev { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.1; opacity: 0.55; }
      .stage { fill: #fff7ed; fill: light-dark(#fff7ed, #25190b); stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 1.4; }
      .ghostStage { fill: #fff7ed; fill: light-dark(#fff7ed, #25190b); stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 1.1; opacity: 0.55; }
      .ep { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.4; }
      .meta { fill: none; stroke: #6b7280; stroke: light-dark(#6b7280, #9ca3af); stroke-width: 1.3; stroke-dasharray: 7 5; }
      .text { fill: #111827; fill: light-dark(#111827, #f9fafb); font: 15px Arial, sans-serif; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 12px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 15px Arial, sans-serif; }
      .line { stroke: #76b900; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #d1d5db; stroke: light-dark(#d1d5db, #4b5563); stroke-width: 1.1; stroke-dasharray: 6 5; }
    ]]></style>
  </defs>

  <rect x="28" y="18" width="220" height="34" rx="8" class="box"/>
  <text x="138" y="41" text-anchor="middle" class="label">Pipeline object lifecycle</text>
  <line x1="448" y1="64" x2="448" y2="348" class="divider"/>
  <rect x="162" y="64" width="138" height="34" rx="7" class="host"/>
  <text x="231" y="87" text-anchor="middle" class="small">host setup</text>
  <rect x="610" y="64" width="190" height="34" rx="7" class="dev"/>
  <text x="705" y="87" text-anchor="middle" class="small">kernel/device work</text>

  <rect x="44" y="130" width="176" height="66" rx="8" class="host"/>
  <text x="132" y="156" text-anchor="middle" class="text">global tensors</text>
  <text x="132" y="176" text-anchor="middle" class="small">make_gmem_tensor</text>

  <rect x="276" y="130" width="176" height="66" rx="8" class="host"/>
  <text x="364" y="156" text-anchor="middle" class="text">host pipeline</text>
  <text x="364" y="176" text-anchor="middle" class="small">suggest_pipeline</text>
  <path d="M 220 163 L 271 163" class="line"/>

  <rect x="276" y="244" width="176" height="82" rx="8" class="host"/>
  <text x="364" y="270" text-anchor="middle" class="text">launch metadata</text>
  <text x="364" y="291" text-anchor="middle" class="small">buffer size/alignment</text>
  <text x="364" y="310" text-anchor="middle" class="small">block dim + handle</text>
  <path d="M 364 196 L 364 239" class="line"/>

  <rect x="520" y="244" width="176" height="82" rx="8" class="dev"/>
  <text x="608" y="270" text-anchor="middle" class="text">device handle</text>
  <text x="608" y="291" text-anchor="middle" class="small">kernel argument</text>
  <text x="608" y="310" text-anchor="middle" class="small">__grid_constant__</text>
  <path d="M 452 285 L 515 285" class="line"/>

  <rect x="784" y="244" width="142" height="82" rx="8" class="dev"/>
  <text x="855" y="270" text-anchor="middle" class="text">tile pipeline</text>
  <text x="855" y="291" text-anchor="middle" class="small">get_tile(smem,</text>
  <text x="855" y="310" text-anchor="middle" class="small">tile row, col)</text>
  <path d="M 696 285 L 779 285" class="line"/>

  <rect x="486" y="108" width="454" height="116" rx="10" class="meta"/>

  <rect x="496" y="118" width="132" height="74" rx="7" class="ghostStage"/>
  <rect x="506" y="126" width="132" height="74" rx="7" class="ghostStage"/>
  <rect x="516" y="134" width="132" height="74" rx="7" class="stage"/>
  <text x="582" y="158" text-anchor="middle" class="text">load stages</text>
  <text x="582" y="179" text-anchor="middle" class="small">K0, K1, K2</text>
  <text x="582" y="196" text-anchor="middle" class="small">async copies</text>

  <rect x="664" y="118" width="132" height="74" rx="7" class="ghostDev"/>
  <rect x="674" y="126" width="132" height="74" rx="7" class="ghostDev"/>
  <rect x="684" y="134" width="132" height="74" rx="7" class="dev"/>
  <text x="750" y="158" text-anchor="middle" class="text">compute stages</text>
  <text x="750" y="179" text-anchor="middle" class="small">MMA K0, K1</text>
  <text x="750" y="196" text-anchor="middle" class="small">async issue</text>

  <rect x="842" y="134" width="88" height="74" rx="7" class="ep"/>
  <text x="886" y="158" text-anchor="middle" class="small">one</text>
  <text x="886" y="177" text-anchor="middle" class="small">epilogue</text>
  <text x="886" y="196" text-anchor="middle" class="small">stage</text>

  <path d="M 648 171 L 679 171" class="line"/>
  <path d="M 816 171 L 837 171" class="line"/>
  <path d="M 855 244 L 855 224" class="line"/>
</svg>
