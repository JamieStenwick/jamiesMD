<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">Pipelined GEMM result storage options</title>
  <desc id="desc">Internal accumulator mode lets the pipeline own the accumulator and invokes an epilogue functor. Reusable accumulator mode lets user code get the accumulator, execute, finish accumulation, and then run a custom epilogue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
    <style><![CDATA[
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.6; }
      .own { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.6; }
      .user { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.5; }
      .finish { fill: #fff7ed; fill: light-dark(#fff7ed, #25190b); stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 1.5; }
      .title { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 18px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 16px Arial, sans-serif; }
      .text { fill: #111827; fill: light-dark(#111827, #f9fafb); font: 16px Arial, sans-serif; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 13px Arial, sans-serif; }
      .line { stroke: #76b900; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect x="28" y="16" width="500" height="36" rx="8" class="box"/>
  <text x="278" y="40" text-anchor="middle" class="title">Choose where the pipelined GEMM accumulator lives</text>

  <rect x="40" y="70" width="405" height="295" rx="12" class="box"/>
  <text x="242" y="106" text-anchor="middle" class="label">internal_accumulator</text>
  <rect x="82" y="148" width="146" height="70" rx="8" class="own"/>
  <text x="155" y="177" text-anchor="middle" class="text">execute</text>
  <text x="155" y="199" text-anchor="middle" class="small">epilogue functor</text>
  <rect x="258" y="148" width="146" height="70" rx="8" class="own"/>
  <text x="331" y="177" text-anchor="middle" class="text">pipeline owns</text>
  <text x="331" y="199" text-anchor="middle" class="small">accumulator</text>
  <path d="M 228 183 L 253 183" class="line"/>
  <rect x="130" y="270" width="224" height="52" rx="8" class="own"/>
  <text x="242" y="301" text-anchor="middle" class="small">functor stores or updates C</text>
  <path d="M 331 218 L 272 265" class="line"/>

  <rect x="515" y="70" width="405" height="295" rx="12" class="box"/>
  <text x="718" y="106" text-anchor="middle" class="label">reusable_accumulator</text>
  <rect x="552" y="148" width="140" height="70" rx="8" class="user"/>
  <text x="622" y="177" text-anchor="middle" class="text">get</text>
  <text x="622" y="199" text-anchor="middle" class="small">accumulator</text>
  <rect x="740" y="148" width="140" height="70" rx="8" class="user"/>
  <text x="810" y="177" text-anchor="middle" class="text">execute</text>
  <text x="810" y="199" text-anchor="middle" class="small">with accumulator</text>
  <path d="M 692 183 L 735 183" class="line"/>
  <rect x="552" y="270" width="140" height="60" rx="8" class="finish"/>
  <text x="622" y="293" text-anchor="middle" class="small">finish</text>
  <text x="622" y="312" text-anchor="middle" class="small">accumulation</text>
  <rect x="740" y="270" width="140" height="60" rx="8" class="user"/>
  <text x="810" y="293" text-anchor="middle" class="small">custom</text>
  <text x="810" y="312" text-anchor="middle" class="small">epilogue</text>
  <path d="M 810 218 C 810 248 622 238 622 265" class="line"/>
  <path d="M 692 300 L 735 300" class="line"/>
</svg>
