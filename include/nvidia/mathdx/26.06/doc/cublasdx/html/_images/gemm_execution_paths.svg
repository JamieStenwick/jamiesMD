<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">cuBLASDx GEMM execution paths</title>
  <desc id="desc">The introduction example loads A and B into shared memory, then demonstrates shared-memory C output, register accumulator output, and return-value accumulator output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
    <style><![CDATA[
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.6; rx: 8; }
      .soft { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.6; rx: 8; }
      .reg { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.4; rx: 8; }
      .text { fill: #111827; fill: light-dark(#111827, #f9fafb); font: 14px Arial, sans-serif; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 12px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 14px Arial, sans-serif; }
      .line { stroke: #76b900; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke: light-dark(#6b7280, #9ca3af); stroke-width: 1.3; stroke-dasharray: 5 5; fill: none; }
    ]]></style>
  </defs>

  <rect x="20" y="16" width="395" height="34" rx="8" class="box"/>
  <text x="218" y="39" text-anchor="middle" class="label">GEMM execution paths used in introduction_example</text>

  <rect x="35" y="62" width="140" height="54" class="box"/>
  <text x="105" y="84" text-anchor="middle" class="text">Global A, B</text>
  <text x="105" y="102" text-anchor="middle" class="small">device pointers</text>

  <rect x="240" y="62" width="150" height="54" class="soft"/>
  <text x="315" y="84" text-anchor="middle" class="text">Shared A, B</text>
  <text x="315" y="102" text-anchor="middle" class="small">cublasdx::copy + wait</text>
  <path d="M 175 89 L 235 89" class="line"/>

  <path d="M 315 116 L 315 142" class="line"/>
  <path d="M 315 142 L 135 142 L 135 171" class="line"/>
  <path d="M 315 142 L 315 171" class="line"/>
  <path d="M 315 142 L 575 142 L 575 171" class="line"/>

  <rect x="30" y="172" width="210" height="82" class="soft"/>
  <text x="135" y="196" text-anchor="middle" class="label">Shared-memory C</text>
  <text x="135" y="218" text-anchor="middle" class="small">load C into shared memory</text>
  <text x="135" y="237" text-anchor="middle" class="small">execute(alpha, A, B, beta, C)</text>

  <rect x="260" y="172" width="210" height="82" class="reg"/>
  <text x="365" y="196" text-anchor="middle" class="label">Register accumulator</text>
  <text x="365" y="218" text-anchor="middle" class="small">create accumulator first</text>
  <text x="365" y="237" text-anchor="middle" class="small">execute(A, B, accumulator)</text>

  <rect x="500" y="172" width="220" height="82" class="reg"/>
  <text x="610" y="196" text-anchor="middle" class="label">Return-value accumulator</text>
  <text x="610" y="218" text-anchor="middle" class="small">library creates accumulator</text>
  <text x="610" y="237" text-anchor="middle" class="small">auto acc = execute(A, B)</text>

  <rect x="280" y="282" width="200" height="34" class="box"/>
  <text x="380" y="304" text-anchor="middle" class="text">store or epilogue to global C</text>
  <path d="M 135 254 L 135 300 L 275 300" class="line"/>
  <path d="M 365 254 L 365 277" class="line"/>
  <path d="M 610 254 L 610 300 L 485 300" class="line"/>
</svg>
