<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">TRSM left-side and right-side shapes</title>
  <desc id="desc">For left-side TRSM A is M by M and B/X is M by N. For right-side TRSM A is N by N and B/X is M by N.</desc>
  <defs>
    <style><![CDATA[
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.5; }
      .tri { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.6; }
      .rhs { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.4; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 12px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 14px Arial, sans-serif; }
      .op { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 22px Arial, sans-serif; }
      .opLine { stroke: #111827; stroke: light-dark(#111827, #f9fafb); stroke-width: 2.2; stroke-linecap: round; }
      .diag { stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.1; stroke-dasharray: 4 4; }
    ]]></style>
  </defs>

  <rect x="28" y="18" width="382" height="34" rx="8" class="box"/>
  <text x="219" y="41" text-anchor="middle" class="label">TRSM shapes are determined by Side and Size&lt;M, N&gt;</text>

  <rect x="34" y="78" width="376" height="190" rx="10" class="box"/>
  <text x="222" y="106" text-anchor="middle" class="label">Left side: A * X = B</text>
  <rect x="72" y="132" width="112" height="96" rx="8" class="box"/>
  <path d="M 96 150 L 160 210 L 96 210 Z" class="tri"/>
  <line x1="96" y1="150" x2="160" y2="210" class="diag"/>
  <text x="128" y="247" text-anchor="middle" class="small">A: M x M</text>
  <rect x="202" y="154" width="38" height="38" rx="7" class="box"/>
  <g aria-label="multiply">
    <line x1="215" y1="173" x2="227" y2="173" class="opLine"/>
    <line x1="218" y1="168" x2="224" y2="178" class="opLine"/>
    <line x1="218" y1="178" x2="224" y2="168" class="opLine"/>
  </g>
  <rect x="260" y="132" width="112" height="96" rx="8" class="box"/>
  <rect x="282" y="150" width="68" height="60" rx="6" class="rhs"/>
  <text x="316" y="247" text-anchor="middle" class="small">X/B: M x N</text>

  <rect x="450" y="78" width="376" height="190" rx="10" class="box"/>
  <text x="638" y="106" text-anchor="middle" class="label">Right side: X * A = B</text>
  <rect x="488" y="132" width="112" height="96" rx="8" class="box"/>
  <rect x="510" y="150" width="68" height="60" rx="6" class="rhs"/>
  <text x="544" y="247" text-anchor="middle" class="small">X/B: M x N</text>
  <rect x="620" y="154" width="38" height="38" rx="7" class="box"/>
  <g aria-label="multiply">
    <line x1="633" y1="173" x2="645" y2="173" class="opLine"/>
    <line x1="636" y1="168" x2="642" y2="178" class="opLine"/>
    <line x1="636" y1="178" x2="642" y2="168" class="opLine"/>
  </g>
  <rect x="676" y="132" width="112" height="96" rx="8" class="box"/>
  <path d="M 700 150 L 764 210 L 700 210 Z" class="tri"/>
  <line x1="700" y1="150" x2="764" y2="210" class="diag"/>
  <text x="732" y="247" text-anchor="middle" class="small">A: N x N</text>

  <rect x="190" y="294" width="480" height="38" rx="8" class="box"/>
  <text x="430" y="318" text-anchor="middle" class="small">B is overwritten in place with X; FillMode selects which triangle of A is read.</text>
</svg>
