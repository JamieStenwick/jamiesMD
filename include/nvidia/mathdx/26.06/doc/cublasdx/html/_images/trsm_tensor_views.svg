<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">TRSM tensor views and FillMode</title>
  <desc id="desc">Arrangement describes storage layout, while FillMode describes the triangular matrix after applying tensor views such as conj_transpose_view.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/></marker>
    <style><![CDATA[
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.5; }
      .tri { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.5; }
      .view { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.4; }
      .warn { fill: #fff7ed; fill: light-dark(#fff7ed, #25190b); stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 1.4; }
      .text { fill: #111827; fill: light-dark(#111827, #f9fafb); font: 15px Arial, sans-serif; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 12px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 15px Arial, sans-serif; }
      .diag { stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.2; stroke-dasharray: 4 4; }
      .line { stroke: #76b900; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect x="30" y="18" width="315" height="34" rx="8" class="box"/>
  <text x="188" y="41" text-anchor="middle" class="label">TRSM storage layout vs viewed triangle</text>

  <rect x="56" y="92" width="220" height="202" rx="10" class="box"/>
  <text x="166" y="121" text-anchor="middle" class="label">Stored tensor A</text>
  <rect x="102" y="146" width="128" height="108" rx="8" class="box"/>
  <path d="M 126 166 L 206 234 L 126 234 Z" class="tri"/>
  <line x1="126" y1="166" x2="206" y2="234" class="diag"/>
  <text x="166" y="278" text-anchor="middle" class="small">Arrangement: col_major</text>
  <text x="166" y="312" text-anchor="middle" class="small">stored data is lower</text>

  <rect x="360" y="112" width="220" height="92" rx="10" class="view"/>
  <text x="470" y="145" text-anchor="middle" class="label">conj_transpose_view(A)</text>
  <text x="470" y="171" text-anchor="middle" class="small">lazy: no copy, no materialized transpose</text>
  <path d="M 276 190 L 355 158" class="line"/>

  <rect x="664" y="92" width="220" height="202" rx="10" class="box"/>
  <text x="774" y="121" text-anchor="middle" class="label">Matrix seen by execute()</text>
  <rect x="710" y="146" width="128" height="108" rx="8" class="box"/>
  <path d="M 734 166 L 814 166 L 814 234 Z" class="view"/>
  <line x1="734" y1="166" x2="814" y2="234" class="diag"/>
  <text x="774" y="278" text-anchor="middle" class="small">FillMode: upper</text>
  <text x="774" y="312" text-anchor="middle" class="small">describes viewed matrix</text>
  <path d="M 580 158 L 659 190" class="line"/>

  <rect x="190" y="318" width="560" height="54" rx="8" class="warn"/>
  <text x="470" y="341" text-anchor="middle" class="small">Rule: Arrangement describes memory storage;</text>
  <text x="470" y="359" text-anchor="middle" class="small">FillMode describes the tensor passed to execute().</text>
</svg>
