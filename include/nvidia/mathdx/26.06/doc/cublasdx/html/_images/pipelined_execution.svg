<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">cuBLASDx pipelined GEMM execution</title>
  <desc id="desc">A CUDA thread block uses a host-created pipeline to overlap multiple asynchronous load stages with multiple asynchronous compute stages, then runs one epilogue stage to produce the output tile.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
    <style><![CDATA[
      .frame { fill: #ffffff; fill: light-dark(#ffffff, #0b1220); stroke: #d1d5db; stroke: light-dark(#d1d5db, #4b5563); stroke-width: 1.3; }
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.6; }
      .soft { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.6; }
      .ghostSoft { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.1; opacity: 0.55; }
      .stage { fill: #fff7ed; fill: light-dark(#fff7ed, #25190b); stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 1.5; }
      .ghostStage { fill: #fff7ed; fill: light-dark(#fff7ed, #25190b); stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 1.1; opacity: 0.55; }
      .dev { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.5; }
      .ghostDev { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.1; opacity: 0.55; }
      .grid { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.1; }
      .tile { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 2.2; }
      .title { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 18px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 16px Arial, sans-serif; }
      .text { fill: #111827; fill: light-dark(#111827, #f9fafb); font: 16px Arial, sans-serif; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 13px Arial, sans-serif; }
      .line { stroke: #76b900; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #76b900; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect x="28" y="16" width="650" height="36" rx="8" class="box"/>
  <text x="353" y="40" text-anchor="middle" class="title">One CUDA block overlaps load and compute stages through a pipeline</text>

  <rect x="36" y="68" width="250" height="272" rx="12" class="frame"/>
  <text x="161" y="98" text-anchor="middle" class="label">Host setup</text>
  <rect x="70" y="128" width="78" height="104" rx="8" class="box"/>
  <text x="109" y="166" text-anchor="middle" class="text">A</text>
  <text x="109" y="192" text-anchor="middle" class="small">global</text>
  <text x="109" y="211" text-anchor="middle" class="small">tensor</text>
  <rect x="174" y="128" width="78" height="104" rx="8" class="box"/>
  <text x="213" y="166" text-anchor="middle" class="text">B</text>
  <text x="213" y="192" text-anchor="middle" class="small">global</text>
  <text x="213" y="211" text-anchor="middle" class="small">tensor</text>
  <rect x="78" y="270" width="166" height="54" rx="8" class="soft"/>
  <text x="161" y="292" text-anchor="middle" class="text">Pipeline handle</text>
  <text x="161" y="311" text-anchor="middle" class="small">suggest_pipeline</text>

  <rect x="370" y="68" width="320" height="272" rx="12" class="frame"/>
  <text x="530" y="98" text-anchor="middle" class="label">Thread block pipeline</text>
  <rect x="390" y="112" width="242" height="76" rx="8" class="ghostSoft"/>
  <rect x="400" y="120" width="242" height="76" rx="8" class="ghostSoft"/>
  <rect x="410" y="128" width="242" height="76" rx="8" class="soft"/>
  <text x="531" y="154" text-anchor="middle" class="text">Shared buffers</text>
  <text x="531" y="176" text-anchor="middle" class="small">K0, K1, K2, ...</text>
  <text x="531" y="193" text-anchor="middle" class="small">copies in flight</text>
  <rect x="382" y="226" width="116" height="72" rx="8" class="ghostStage"/>
  <rect x="392" y="234" width="116" height="72" rx="8" class="ghostStage"/>
  <rect x="402" y="242" width="116" height="72" rx="8" class="stage"/>
  <text x="460" y="269" text-anchor="middle" class="text">Load stages</text>
  <text x="460" y="292" text-anchor="middle" class="small">TMA / LDG async</text>
  <rect x="538" y="226" width="116" height="72" rx="8" class="ghostDev"/>
  <rect x="548" y="234" width="116" height="72" rx="8" class="ghostDev"/>
  <rect x="558" y="242" width="116" height="72" rx="8" class="dev"/>
  <text x="616" y="269" text-anchor="middle" class="text">Compute stages</text>
  <text x="616" y="292" text-anchor="middle" class="small">MMA async</text>
  <path d="M 490 204 L 460 236" class="thin"/>
  <path d="M 572 204 L 616 236" class="thin"/>
  <path d="M 518 278 L 553 278" class="line"/>
  <rect x="770" y="68" width="154" height="272" rx="12" class="frame"/>
  <text x="847" y="98" text-anchor="middle" class="label">Output tile</text>
  <g transform="translate(793 132)">
    <rect x="0" y="0" width="108" height="108" class="grid"/>
    <path d="M 27 0 L 27 108 M 54 0 L 54 108 M 81 0 L 81 108 M 0 27 L 108 27 M 0 54 L 108 54 M 0 81 L 108 81" class="grid"/>
    <rect x="54" y="27" width="27" height="27" class="tile"/>
  </g>
  <rect x="804" y="260" width="86" height="48" rx="7" class="box"/>
  <text x="847" y="280" text-anchor="middle" class="small">one epilogue</text>
  <text x="847" y="297" text-anchor="middle" class="small">store/update C</text>

  <path d="M 286 194 L 365 170" class="line"/>
  <path d="M 244 297 C 312 318 346 292 405 278" class="line"/>
  <path d="M 674 278 L 799 260" class="line"/>
</svg>
