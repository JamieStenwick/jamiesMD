<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">cuBLASDx GEMM performance tuning tradeoffs</title>
  <desc id="desc">Tile shape, pipeline depth, alignment, and block size influence data reuse, overlap, shared memory use, register pressure, and occupancy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/></marker>
    <style><![CDATA[
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.5; }
      .knob { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.4; }
      .benefit { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.5; }
      .cost { fill: #fff7ed; fill: light-dark(#fff7ed, #25190b); stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 1.4; }
      .text { fill: #111827; fill: light-dark(#111827, #f9fafb); font: 15px Arial, sans-serif; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 12px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 15px Arial, sans-serif; }
      .line { stroke: #76b900; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .costLine { stroke: #f97316; stroke: light-dark(#f97316, #fb923c); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect x="30" y="18" width="335" height="34" rx="8" class="box"/>
  <text x="198" y="41" text-anchor="middle" class="label">Pipelined GEMM tuning tradeoffs</text>

  <rect x="52" y="90" width="182" height="78" rx="9" class="knob"/>
  <text x="143" y="119" text-anchor="middle" class="text">tile_m, tile_n</text>
  <text x="143" y="141" text-anchor="middle" class="small">output tile shape</text>

  <rect x="52" y="198" width="182" height="78" rx="9" class="knob"/>
  <text x="143" y="227" text-anchor="middle" class="text">tile_k, depth</text>
  <text x="143" y="249" text-anchor="middle" class="small">pipeline stages</text>

  <rect x="52" y="306" width="182" height="78" rx="9" class="knob"/>
  <text x="143" y="335" text-anchor="middle" class="text">BlockDim, alignment</text>
  <text x="143" y="357" text-anchor="middle" class="small">threads and vectorization</text>

  <rect x="382" y="92" width="196" height="84" rx="9" class="benefit"/>
  <text x="480" y="122" text-anchor="middle" class="label">Potential gains</text>
  <text x="480" y="147" text-anchor="middle" class="small">reuse, coalescing, overlap</text>
  <text x="480" y="166" text-anchor="middle" class="small">fewer global-memory stalls</text>

  <rect x="382" y="254" width="196" height="94" rx="9" class="cost"/>
  <text x="480" y="284" text-anchor="middle" class="label">Resource costs</text>
  <text x="480" y="309" text-anchor="middle" class="small">shared memory, registers</text>
  <text x="480" y="328" text-anchor="middle" class="small">producer threads, occupancy</text>

  <path d="M 234 129 L 377 129" class="line"/>
  <path d="M 234 237 C 300 230 326 163 377 151" class="line"/>
  <path d="M 234 345 C 310 340 326 170 377 162" class="line"/>
  <path d="M 234 151 C 300 170 326 254 377 282" class="costLine"/>
  <path d="M 234 237 C 300 246 325 292 377 301" class="costLine"/>
  <path d="M 234 345 L 377 316" class="costLine"/>

  <rect x="704" y="120" width="196" height="86" rx="9" class="benefit"/>
  <text x="802" y="150" text-anchor="middle" class="label">Measure</text>
  <text x="802" y="175" text-anchor="middle" class="small">Release build</text>
  <text x="802" y="194" text-anchor="middle" class="small">full-device workload</text>
  <path d="M 578 134 L 699 154" class="line"/>
  <path d="M 578 301 L 699 184" class="costLine"/>

  <rect x="704" y="264" width="196" height="86" rx="9" class="box"/>
  <text x="802" y="294" text-anchor="middle" class="label">Iterate</text>
  <text x="802" y="319" text-anchor="middle" class="small">change one knob at a time</text>
  <text x="802" y="338" text-anchor="middle" class="small">keep correctness checks</text>
  <path d="M 802 206 L 802 259" class="line"/>
</svg>
