<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc" style="background: transparent; color-scheme: light dark;">
  <title id="title">cuBLASDx tensor data flow</title>
  <desc id="desc">Pointers and layouts form tensor descriptors. Explicit copy operations move data between global memory, shared memory, and register fragments before and after execute.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/></marker>
    <style><![CDATA[
      .box { fill: #ffffff; fill: light-dark(#ffffff, #111827); stroke: #1f2937; stroke: light-dark(#1f2937, #76b900); stroke-width: 1.5; rx: 8; }
      .soft { fill: #f3f7ec; fill: light-dark(#f3f7ec, #13220c); stroke: #76b900; stroke: light-dark(#76b900, #93d85b); stroke-width: 1.5; rx: 8; }
      .reg { fill: #eef6ff; fill: light-dark(#eef6ff, #0f1d2e); stroke: #2563eb; stroke: light-dark(#2563eb, #60a5fa); stroke-width: 1.3; rx: 8; }
      .text { fill: #111827; fill: light-dark(#111827, #f9fafb); font: 14px Arial, sans-serif; }
      .small { fill: #374151; fill: light-dark(#374151, #d1d5db); font: 12px Arial, sans-serif; }
      .label { fill: #111827; fill: light-dark(#111827, #f9fafb); font: bold 14px Arial, sans-serif; }
      .line { stroke: #76b900; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #76b900; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect x="20" y="16" width="390" height="34" rx="8" class="box"/>
  <text x="215" y="39" text-anchor="middle" class="label">Tensor objects describe data; copy calls move it</text>

  <rect x="28" y="62" width="150" height="60" class="box"/>
  <text x="103" y="86" text-anchor="middle" class="text">Pointer</text>
  <text x="103" y="105" text-anchor="middle" class="small">global or shared address</text>

  <rect x="28" y="170" width="150" height="60" class="box"/>
  <text x="103" y="194" text-anchor="middle" class="text">Layout</text>
  <text x="103" y="213" text-anchor="middle" class="small">shape, stride, padding</text>

  <rect x="245" y="112" width="170" height="68" class="soft"/>
  <text x="330" y="139" text-anchor="middle" class="label">cublasdx::tensor</text>
  <text x="330" y="160" text-anchor="middle" class="small">view, not a copy</text>
  <path d="M 178 92 L 240 130" class="thin"/>
  <path d="M 178 200 L 240 162" class="thin"/>

  <rect x="485" y="46" width="220" height="54" class="soft"/>
  <text x="595" y="68" text-anchor="middle" class="text">Global &lt;-&gt; shared</text>
  <text x="595" y="86" text-anchor="middle" class="small">cublasdx::copy + copy_wait</text>

  <rect x="485" y="123" width="220" height="54" class="reg"/>
  <text x="595" y="145" text-anchor="middle" class="text">Shared -> registers</text>
  <text x="595" y="163" text-anchor="middle" class="small">execute reads A/B tiles</text>

  <rect x="485" y="200" width="220" height="54" class="reg"/>
  <text x="595" y="222" text-anchor="middle" class="text">Registers -> tensor</text>
  <text x="595" y="240" text-anchor="middle" class="small">partition_and_copy/store</text>

  <path d="M 415 146 L 480 73" class="line"/>
  <path d="M 415 146 L 480 150" class="line"/>
  <path d="M 415 146 L 480 227" class="line"/>
</svg>
